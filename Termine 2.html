    <h2>Buchungskalender</h2>
    <p>🟢 frei | 🔴 belegt</p>

    <div id="kalender"></div>

    <script>
    const belegteTage = [
      "2026-02-10",
      "2026-02-14",
     "2026-02-05",
     "2026-02-21"
    ];

    const heute = new Date();
    const jahr = heute.getFullYear();
    const monat = heute.getMonth();

    function kalenderErstellen(jahr, monat) {
        const kalender = document.getElementById("kalender");
        kalender.innerHTML = "";

        const tageImMonat = new Date(jahr, monat + 1, 0).getDate();
        const ersterTag = new Date(jahr, monat, 1).getDay();
        const wochentage = ["So","Mo","Di","Mi","Do","Fr","Sa"];

        let html = "<table><tr>";
        wochentage.forEach(tag => html += "<th>" + tag + "</th>");
        html += "</tr><tr>";

        for (let i = 0; i < ersterTag; i++) html += "<td></td>";

        for (let tag = 1; tag <= tageImMonat; tag++) {
            const datum = `${jahr}-${String(monat+1).padStart(2,"0")}-${String(tag).padStart(2,"0")}`;

        if ((tag + ersterTag - 1) % 7 === 0) html += "</tr><tr>";

        if (belegteTage.includes(datum)) {
        html += `<td class="belegt">${tag}</td>`;
        } else {
        html += `<td class="frei" onclick="buchen('${datum}')">${tag}</td>`;
        }
        }

        html += "</tr></table>";
        kalender.innerHTML = html;
    }

    function buchen(datum) {
        alert("Du hast den " + datum + " ausgewählt!");
        // hier später Formular, E-Mail oder Datenbank einbauen
    }

    kalenderErstellen(jahr, monat);
    </script>
