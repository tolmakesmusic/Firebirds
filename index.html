<!DOCTYPE html>
<html lang="de">
<head>

    <title>Einfache Webseite</title>
    <style>

            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;

        header {
            background-color: #771919;
            color: white;
            padding: 20px 10px;
            text-align: center;
        }
        nav {
            background-color: #484752;

        }
        nav a {
            color: white;

        }
        nav a:hover {

        main {

            background-color: #3c3938;
